apply plugin: 'com.android.application'

def keystorePropsFile = rootProject.file('keystore.properties')
def canSign = keystorePropsFile.exists()

android {
    // compileSdk/targetSdk: 24 会让 Android 12+ 提示「此应用专为旧版 Android 打造，
    // 可能无法正常运行」，且部分系统会限制安装；提到 29 消除该提示。
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "com.ncnn.yoloworld.demo"
        archivesBaseName = "$applicationId"

        versionCode 4
        versionName "1.2.1"
        minSdkVersion 24
        targetSdkVersion 29

        externalNativeBuild {
            cmake {
                // ncnn 20260526 头文件需要 C++17
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            version "3.10.2"
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
